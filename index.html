<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caxias Mais Esporte · Secretaria de Esportes e Lazer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;600&display=swap">
<style>
:root{--paper:#f7f4ed;--ink:#16202e;--navy:#1a365d;--green:#10b981;--line:#d8d2c4;--mut:#5b6472;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:80px}
body{margin:0;background:var(--paper);color:var(--ink);font:18px/1.55 Barlow,system-ui,sans-serif}
h1,h2,h3{font-family:"Barlow Condensed",Impact,sans-serif;text-transform:uppercase;letter-spacing:.01em;line-height:1.05;margin:0}
h1{font-size:clamp(40px,8vw,76px);font-weight:800}h2{font-size:34px;font-weight:800;color:var(--navy);padding-bottom:8px;border-bottom:3px solid var(--navy);margin:44px 0 18px}h3{font-size:24px;font-weight:600}
a{color:var(--navy)}.mut{color:var(--mut);font-size:16px}
header{background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:9}
.top{background:var(--navy);color:#cbd5e1;font-size:14px;padding:4px 16px}
.hd{max-width:1120px;margin:auto;padding:8px 16px;display:flex;flex-wrap:wrap;gap:4px 24px;align-items:center;justify-content:space-between}
.brand{font:800 24px/1 "Barlow Condensed",sans-serif;text-transform:uppercase;color:var(--navy);text-decoration:none;display:flex;align-items:center;gap:12px}
.logo{height:52px;width:auto;display:block}@media(max-width:600px){.brand span{font-size:18px;line-height:1.05}.logo{height:40px}}
nav{display:flex;gap:20px}nav a{min-height:48px;display:flex;align-items:center;text-decoration:none;font-weight:600;color:var(--ink);border-bottom:3px solid transparent}nav a.on{border-color:var(--green)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 24px;background:var(--green);color:#022c1e;font:600 18px Barlow,sans-serif;border:0;border-radius:2px;text-decoration:none;cursor:pointer}
.btn.o{background:transparent;color:var(--navy);border:2px solid var(--navy)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #d97706;outline-offset:2px}
main{max-width:1120px;margin:auto;padding:24px 16px}
.hero{display:grid;gap:28px;grid-template-columns:1fr;align-items:center}@media(min-width:860px){.hero{grid-template-columns:1.1fr .9fr}}
.eb{font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:14px;color:var(--mut);margin-bottom:10px}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
.ph{aspect-ratio:4/3;display:flex;align-items:flex-end;padding:14px;color:#fff;font:800 34px/1 "Barlow Condensed",sans-serif;text-transform:uppercase;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.06) 0 14px,transparent 14px 28px)}
.fi img,.fi iframe{width:100%;aspect-ratio:4/3;object-fit:cover;border:0;display:block;background:#000}
.ev{display:grid;grid-template-columns:76px 1fr;gap:16px;padding:16px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.ev:hover h3{text-decoration:underline}
.db{background:var(--navy);color:#fff;text-align:center;padding:8px 0;font:800 36px/1 "Barlow Condensed",sans-serif}.db small{display:block;font:600 14px Barlow;letter-spacing:.1em;text-transform:uppercase;color:#a7f3d0}
.st{display:inline-block;font:600 14px Barlow;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border:2px solid;margin-bottom:4px}
.st.ab{background:var(--green);border-color:var(--green);color:#022c1e}.st.br{border-color:#b45309;color:#92400e}.st.en{border-color:#6b7280;color:#4b5563}.st.es{background:#b91c1c;border-color:#b91c1c;color:#fff}
.g3{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}.fb{padding:10px 0}.fb p{margin:4px 0}
.num{background:var(--navy);color:#fff;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1px;margin-top:44px}.num div{padding:22px;border-left:1px solid rgba(255,255,255,.2)}.num b{display:block;font:800 52px/1 "Barlow Condensed",sans-serif;color:#6ee7b7}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.chip{min-height:48px;padding:0 16px;background:transparent;border:2px solid var(--navy);color:var(--navy);font:600 17px Barlow;cursor:pointer;border-radius:2px}.chip.on{background:var(--navy);color:#fff}
input,select{width:100%;min-height:52px;font:18px Barlow;padding:0 12px;border:2px solid #8a93a0;border-radius:2px;background:#fff}
label{display:block;font-weight:600;margin:14px 0 4px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:18px 0;padding:14px 0;border-block:1px solid var(--line)}.kv b{display:block;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid var(--line)}
iframe.ch{width:100%;height:420px;border:1px solid var(--line);background:#fff}
form{background:#fff;border:1px solid var(--line);padding:20px;max-width:720px}.f2{display:grid;gap:0 16px;grid-template-columns:1fr}@media(min-width:700px){.f2{grid-template-columns:1fr 1fr}}
.safe{border-left:4px solid var(--green);background:#ecfdf5;padding:10px 14px;margin:12px 0;max-width:720px}
.err{color:#b91c1c;font-weight:600;margin-top:10px;display:none}.ck{display:flex;gap:10px;align-items:flex-start;margin-top:16px}.ck input{width:28px;min-height:28px;margin-top:4px}
.m{position:fixed;inset:0;background:rgba(22,32,46,.95);display:none;align-items:center;justify-content:center;z-index:99;padding:20px}.m.on{display:flex}.m div{background:#fff;padding:30px;max-width:480px;text-align:center}
footer{background:var(--navy);color:#dbe4f0;padding:28px 16px 90px;margin-top:48px}footer div{max-width:1120px;margin:auto}footer a{color:#6ee7b7}
.wa{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));background:#128c4a;color:#fff;min-height:52px;padding:0 18px;display:flex;align-items:center;font-weight:600;text-decoration:none;border-radius:2px;z-index:8;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.pg{display:none}.pg.on{display:block}
.btn[disabled]{background:#cbd5e1;color:#475569;cursor:not-allowed}
.prot{font:800 28px/1.2 "Barlow Condensed",sans-serif;color:var(--navy);margin:12px 0;word-break:break-all}
.at{border:1px solid var(--line);background:#fff;padding:6px 14px 14px;margin:16px 0}.at legend{font:800 22px "Barlow Condensed",sans-serif;text-transform:uppercase;color:var(--navy);padding:0 6px}
.g4{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}.fp{display:block}.fp img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.cd{display:block;background:#fff;border:1px solid var(--line);text-decoration:none;color:inherit}.cd:hover{border-color:var(--navy)}.cd img,.cd .ph{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}.cb{padding:12px 14px}.cc{background:var(--navy);color:#fff;padding:14px;text-align:center;font-weight:600}
.fb2{display:grid;gap:12px;grid-template-columns:1fr;background:#fff;border:1px solid var(--line);padding:14px;margin:14px 0}@media(min-width:760px){.fb2{grid-template-columns:1fr 1fr 1.4fr}}.fb2 label{margin:0}
.stp{display:flex;align-items:center;gap:12px;margin:24px 0 8px}.stp span{background:var(--navy);color:#fff;min-width:40px;height:40px;display:flex;align-items:center;justify-content:center;font:800 22px "Barlow Condensed",sans-serif}.stp h2{border:0;margin:0;padding:0;font-size:28px}
.tm{border:1px solid var(--navy);background:#f1f5fb;padding:4px 16px 8px;margin:8px 0}.tm summary{font-weight:600;cursor:pointer;color:var(--navy);min-height:44px;display:flex;align-items:center}
.card2{background:#fff;border:1px solid var(--line);padding:16px;margin:16px 0}.cod{display:flex;gap:10px}.cod input{font:800 30px "Barlow Condensed",sans-serif;letter-spacing:.25em;text-transform:uppercase;text-align:center}
.cn{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:16px 0}.cn b{font:800 24px "Barlow Condensed",sans-serif;text-transform:uppercase;text-align:center}.cw{display:none}.cg{display:grid;gap:8px;grid-template-columns:1fr}.dp{display:none}
.dc{background:#fff;border:1px solid var(--line);padding:10px 12px;min-height:56px;display:flex;gap:12px;align-items:flex-start}.dc:not(.tem){background:transparent;border-style:dashed;min-height:46px;opacity:.65}.dc.hoje{border:2px solid var(--green);opacity:1}
.dn{min-width:54px}.dn b{display:block;font:800 28px/1 "Barlow Condensed",sans-serif}.dn span{font-size:13px;color:var(--mut);text-transform:uppercase}.dv{flex:1;min-width:0}
.de{display:block;text-decoration:none;color:var(--ink);border-left:4px solid var(--navy);padding:6px 10px;background:#eef3fb;margin-bottom:6px}.de.ab{border-color:var(--green);background:#ecfdf5}.de.es{border-color:#b91c1c;background:#fef2f2}.de small{display:block;color:var(--mut)}
@media(min-width:760px){.cw{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;text-align:center;font-weight:600;color:var(--mut);margin-bottom:6px}.cg{grid-template-columns:repeat(7,1fr)}.dp{display:block}.dc{flex-direction:column;gap:6px;min-height:110px}.dn span{display:none}.de{font-size:15px;padding:4px 8px}}
@media(max-width:700px){.top{display:none}header{position:static}.hd{justify-content:flex-start}.hd>.btn{display:none}h1{font-size:40px}h2{font-size:28px}.row{flex-direction:column}.row .btn{width:100%}.cod{flex-direction:column}main{padding-bottom:96px}footer{padding-bottom:150px}
#nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:20;gap:0;padding-bottom:env(safe-area-inset-bottom,0px)}#nav a{flex:1;justify-content:center;text-align:center;font-size:12px;letter-spacing:-.01em;min-height:58px;border-bottom:0;border-top:4px solid transparent;padding:0 2px}#nav a.on{border-top-color:var(--green)}.wa{bottom:calc(72px + env(safe-area-inset-bottom,0px));min-height:48px;padding:0 14px;font-size:15px}}
</style></head><body>
